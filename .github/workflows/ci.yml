name: CI

on:
  push:
  pull_request:

# Least privilege: these jobs only ever read the checkout. Declared
# explicitly so the workflow keeps its own floor even if the repository
# default token permission is widened later.
permissions:
  contents: read

jobs:
  # The three brute-force checkers, which are the point of the repository: each
  # enumerates the small cases and compares against what the solution claims.
  # `q3_search.py` is deliberately absent -- it is a search, not a check, and
  # takes minutes.
  checkers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 as well as 3.13, because the README claims "Python 3 only, no
        # dependencies" and nothing had ever tested that on an old interpreter.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python q1_check.py
      - run: python q2_check.py
      - run: python q3_check.py

  # The a-part programs read stdin and write stdout. WRITTEN_ANSWERS.md says of
  # each one "sample run reproduced", so that is what is checked here: the exact
  # stdout for the sample input, not merely that something was printed.
  programs-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Each q*(a) program reproduces its sample run
        run: |
          set -e
          sample () {   # program, stdin, expected stdout
            got=$(printf '%s\n' "$2" | python "$1")
            if [ "$got" != "$3" ]; then
              echo "$1: input [$2] expected [$3] but got [$got]" >&2
              exit 1
            fi
            echo "$1: $2 -> $got"
          }
          sample q1_palindromic_sums.py "1031" "1 101 929"
          sample q2_safe_haven.py "3 5 5" "2 1"
          sample q3_short_fuse.py "2 1 1" "7"

  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
